<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rastreamentos de Pedidos AM</title>
    <link rel="icon" type="image/webp" href="https://i.postimg.cc/gwxjQTNv/correios2.webp">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Fundo claro/branco */
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* ORBES ANIMADOS DE FUNDO (TEMA CLARO COM AZUIS) */
        .bg-shapes {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #f8fafc;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px); /* Aumentado o blur para deixar mais difuso */
            animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.25; /* Opacidade reduzida para efeitos mais leves */
        }
        .shape-1 {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6); /* Azul escuro / Marinho */
            top: -100px; left: -100px;
        }
        .shape-2 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #312e81, #4f46e5); /* Indigo escuro */
            bottom: -50px; right: -100px;
            animation-delay: -5s;
            animation-direction: alternate-reverse;
        }
        .shape-3 {
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #0f172a, #1d4ed8); /* Slate escuro e Azul forte */
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(30px, -50px) rotate(10deg) scale(1.1); }
            66% { transform: translate(-20px, 20px) rotate(-5deg) scale(0.9); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        /* EFEITOS DE VIDRO LIGHT (GLASSMORPHISM CLARO) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0 20px rgba(59, 130, 246, 0.05);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), inset 0 0 20px rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* Custom Input */
        input[type="text"]::-webkit-search-decoration,
        input[type="text"]::-webkit-search-cancel-button,
        input[type="text"]::-webkit-search-results-button,
        input[type="text"]::-webkit-search-results-decoration { display: none; }
        
        .input-glow:focus-within {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(255, 255, 255, 0.95);
        }

        /* Animações UI */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .fade-in-up { 
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .text-gradient {
            background: linear-gradient(to right, #1e3a8a, #2563eb); /* Título também num azul mais escuro */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Botão Gradient Animado */
        .btn-gradient {
            background: linear-gradient(45deg, #1e3a8a, #1d4ed8, #1e40af); /* Azuis mais escuros */
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            box-shadow: 0 0 20px rgba(30, 58, 138, 0.3);
            transform: scale(1.02);
        }
        .btn-gradient:active { transform: scale(0.95); }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start md:justify-center p-4 pt-8 md:pt-12 relative">

    <!-- FUNDO ANIMADO -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- MAIN WRAPPER -->
    <main class="w-full max-w-3xl fade-in-up z-10 relative">
        
        <!-- CARD PRINCIPAL DE VIDRO -->
        <div class="glass-panel rounded-[2rem] overflow-hidden relative">
            
            <!-- Brilho no topo -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 via-cyan-400 to-blue-500 opacity-80"></div>
            
            <div class="p-6 md:p-10 space-y-10">
                
                <!-- HEADER & LOGO -->
                <header class="text-center space-y-4">
                    <div class="flex justify-center mb-6 relative">
                        <!-- Brilho atrás do logo -->
                        <div class="absolute inset-0 bg-blue-50/50 blur-2xl rounded-full scale-150 z-0"></div>
                        <!-- Logo sem o filtro brightness para aparecer corretamente no fundo branco -->
                        <img src="https://i.postimg.cc/J0G8jfMQ/as-02-(2).png" alt="Logo Doremus" class="h-14 md:h-20 w-auto object-contain relative z-10 drop-shadow-sm">
                    </div>

                    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-gradient pb-1">
                        Rastreio de Amostras
                    </h1>
                    <p class="text-slate-500 text-sm md:text-base font-medium">
                        Tecnologia e rapidez no acompanhamento do seu pedido.
                    </p>
                </header>

                <!-- SEARCH COMPONENT -->
                <div class="max-w-xl mx-auto relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-blue-200 to-cyan-200 rounded-2xl blur opacity-40 group-focus-within:opacity-80 transition duration-500"></div>
                    
                    <div class="relative flex flex-col sm:flex-row gap-3 glass-card p-2 rounded-2xl input-glow border-white">
                        <div class="relative flex-grow flex items-center">
                            <div class="absolute left-4 text-blue-500">
                                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="orderNumberInput" placeholder="Nº do pedido (Ex: 475896)" class="block w-full pl-14 pr-12 py-4 rounded-xl bg-transparent focus:outline-none text-lg text-slate-800 font-bold placeholder-slate-400" autocomplete="off" inputmode="text">
                            
                            <!-- Botão Limpar -->
                            <button id="clearBtn" type="button" class="hidden absolute right-4 text-slate-300 hover:text-slate-500 transition-colors p-1" title="Limpar busca">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <button id="searchButton" type="button" class="btn-gradient text-white font-bold py-4 px-8 rounded-xl shadow-md flex items-center justify-center min-w-[140px] text-lg uppercase tracking-wider">
                            Buscar
                        </button>
                    </div>

                    <!-- Buscas Recentes -->
                    <div id="recentSearchesContainer" class="hidden mt-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <span class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Recentes:</span>
                            <div id="recentSearchesList" class="flex gap-2"></div>
                        </div>
                    </div>
                </div>

                <!-- RESULTS CONTAINER -->
                <div id="shipmentsContainer" class="space-y-6 pt-2"></div>

            </div>
            
            <!-- FOOTER -->
            <footer class="bg-slate-50/50 backdrop-blur-lg border-t border-slate-200/50 p-6 text-center">
                <div class="flex flex-col items-center justify-center gap-2">
                    <span class="text-slate-500 text-sm font-medium">Qualquer dúvida, envie um e-mail para:</span>
                    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=amostras@doremus.com.br" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-slate-700 hover:text-blue-700 font-bold transition-colors text-sm px-5 py-2.5 rounded-full glass-card border border-slate-200">
                        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        amostras@doremus.com.br
                    </a>
                </div>
            </footer>
        </div>
    </main>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script type="module">
        // CONFIGURAÇÃO DA PLANILHA (MANTIDA)
        const SHEET_ID = '1Lwsx97SijssRttyUjnbseGhVTSXiciXtZ6Acszsi0h8'; 
        const SHEET_GID = '0'; 
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;

        // Elementos da DOM
        const searchButton = document.getElementById('searchButton');
        const orderInput = document.getElementById('orderNumberInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultsContainer = document.getElementById('shipmentsContainer');
        const recentSearchesContainer = document.getElementById('recentSearchesContainer');
        const recentSearchesList = document.getElementById('recentSearchesList');
        const toastContainer = document.getElementById('toastContainer');

        // Ícones
        const icons = {
            check: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
            copy: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
            external: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`,
            error: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
        };

        // Sistema de Notificação Flutuante (Toast)
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            const isErr = type === 'error';
            
            toast.className = `glass-card pointer-events-auto border-l-4 ${isErr ? 'border-l-red-500 bg-white/90' : 'border-l-blue-500 bg-white/90'} px-5 py-4 rounded-r-2xl shadow-xl flex items-center gap-3 fade-in-up max-w-sm w-full backdrop-blur-xl border-y border-r border-slate-200`;
            
            toast.innerHTML = `
                <div class="${isErr ? 'text-red-500 bg-red-50' : 'text-blue-500 bg-blue-50'} flex-shrink-0 p-1.5 rounded-full shadow-inner border border-${isErr ? 'red' : 'blue'}-100">
                    ${isErr ? icons.error : icons.check}
                </div>
                <p class="text-sm font-bold text-slate-700 leading-tight">${msg}</p>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(15px)';
                toast.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Histórico de Buscas Recentes
        function loadRecentSearches() {
            try {
                const recents = JSON.parse(localStorage.getItem('recentSearches') || '[]');
                if (recents.length > 0) {
                    recentSearchesContainer.classList.remove('hidden');
                    recentSearchesList.innerHTML = recents.map(val => 
                        `<button type="button" onclick="window.useRecent('${val}')" class="px-3 py-1 bg-white hover:bg-blue-50 text-slate-500 hover:text-blue-700 text-xs font-bold rounded-lg border border-slate-200 shadow-sm transition-all active:scale-95">${val}</button>`
                    ).join('');
                } else {
                    recentSearchesContainer.classList.add('hidden');
                }
            } catch(e){}
        }

        function saveRecentSearch(val) {
            if (!val) return;
            try {
                let recents = JSON.parse(localStorage.getItem('recentSearches') || '[]');
                recents = recents.filter(item => item !== val);
                recents.unshift(val);
                if (recents.length > 3) recents.pop(); // Mantém os 3 mais recentes
                localStorage.setItem('recentSearches', JSON.stringify(recents));
                loadRecentSearches();
            } catch(e){}
        }

        window.useRecent = function(val) {
            orderInput.value = val;
            clearBtn.classList.remove('hidden');
            window.handleSearch();
        }

        // Interações do Input (Botão de Limpar)
        orderInput.addEventListener('input', () => {
            clearBtn.classList.toggle('hidden', orderInput.value.length === 0);
        });

        clearBtn.addEventListener('click', () => {
            orderInput.value = '';
            clearBtn.classList.add('hidden');
            orderInput.focus();
            resultsContainer.innerHTML = ''; // Limpa os resultados ao limpar a busca
        });

        // Efeito Skeleton Loading
        function showSkeleton() {
            resultsContainer.innerHTML = `
                <div class="glass-card rounded-2xl overflow-hidden shadow-sm animate-pulse border border-slate-200">
                    <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white/40">
                        <div>
                            <div class="h-2 w-24 bg-slate-300/50 rounded mb-3"></div>
                            <div class="h-8 w-40 bg-slate-300/50 rounded"></div>
                        </div>
                        <div class="h-8 w-20 bg-slate-300/50 rounded-lg"></div>
                    </div>
                    <div class="p-6 space-y-6 bg-white/60">
                        <div>
                            <div class="h-2 w-20 bg-slate-300/50 rounded mb-2"></div>
                            <div class="h-5 w-48 bg-slate-300/50 rounded"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white/80 p-4 rounded-xl border border-slate-100">
                                <div class="h-2 w-16 bg-slate-300/50 rounded mb-2"></div>
                                <div class="h-4 w-24 bg-slate-300/50 rounded"></div>
                            </div>
                            <div class="bg-white/80 p-4 rounded-xl border border-slate-100">
                                <div class="h-2 w-16 bg-slate-300/50 rounded mb-2"></div>
                                <div class="h-4 w-24 bg-slate-300/50 rounded"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Mapeamento dinâmico
        function mapColumns(cols) {
            const map = { pedido: -1, cliente: -1, data: -1, servico: -1, rastreio: -1 };
            cols.forEach((col, index) => {
                const label = (col.label || '').toLowerCase().trim();
                if (label.includes('pedido') || label.includes('nº') || label.includes('order')) map.pedido = index;
                else if (label.includes('cliente') || label.includes('remetente') || label.includes('nome')) map.cliente = index;
                else if (label.includes('rastreio') || label.includes('objeto') || label.includes('tracking')) map.rastreio = index;
                else if (label.includes('data') || label.includes('emissão')) map.data = index;
                else if (label.includes('serviço') || label.includes('tipo')) map.servico = index;
            });
            if (map.pedido === -1) map.pedido = 0; 
            if (map.cliente === -1) map.cliente = 1;
            if (map.data === -1) map.data = 2;
            if (map.servico === -1) map.servico = 3; 
            if (map.rastreio === -1) map.rastreio = 4;
            return map;
        }

        function getBaseId(str) {
            if (!str) return '';
            const s = String(str);
            const firstPart = s.split(/[\/\-\.\s]/)[0];
            return firstPart.replace(/[^a-z0-9]/gi, '').toLowerCase();
        }
        const normalize = (str) => String(str || '').toLowerCase().trim();

        // Lógica de Busca
        window.handleSearch = async function() {
            const rawQuery = orderInput.value.trim();
            const queryBase = getBaseId(rawQuery); 
            const queryLower = rawQuery.toLowerCase();
            
            if (!rawQuery) {
                showToast("Por favor, digite o número do pedido.", 'error');
                setTimeout(() => orderInput.focus(), 100);
                return;
            }

            const originalBtnText = searchButton.innerHTML;
            searchButton.disabled = true;
            searchButton.innerHTML = `<div class="loader"></div>`;
            
            showSkeleton(); // Mostra a animação de carregamento estilizada

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Erro de conexão.");
                const textData = await response.text();
                const jsonString = textData.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
                
                if (!jsonString || !jsonString[1]) throw new Error("Dados inválidos.");
                const data = JSON.parse(jsonString[1]);
                const colMap = mapColumns(data.table.cols);
                const rows = data.table.rows;

                const foundOrders = [];
                const seenBaseIds = new Set();

                rows.forEach(row => {
                    if (!row.c) return;
                    const getVal = (idx) => {
                        const cell = row.c[idx];
                        return cell ? (cell.f ? String(cell.f) : (cell.v ? String(cell.v) : '')) : '';
                    };

                    const pedidoVal = getVal(colMap.pedido);
                    const rastreioVal = getVal(colMap.rastreio);
                    const clienteVal = getVal(colMap.cliente);
                    const rowBaseId = getBaseId(pedidoVal); 

                    let isMatch = (rowBaseId && queryBase && rowBaseId === queryBase) || 
                                  normalize(pedidoVal).includes(queryLower) || 
                                  normalize(rastreioVal).includes(queryLower) || 
                                  normalize(clienteVal).includes(queryLower);

                    if (isMatch) {
                        if (seenBaseIds.has(rowBaseId)) return;
                        seenBaseIds.add(rowBaseId);
                        foundOrders.push({
                            numeroPedido: pedidoVal, remetente: clienteVal,
                            dataLiberacao: getVal(colMap.data) || '-',
                            codigoRastreio: rastreioVal, servico: getVal(colMap.servico) || 'Padrão'
                        });
                    }
                });

                resultsContainer.innerHTML = ''; // Limpa o skeleton

                if (foundOrders.length === 0) {
                    showToast(`Nenhum pedido localizado para "${rawQuery}".`, 'error');
                } else {
                    saveRecentSearch(queryBase); // Salva no histórico ao ter sucesso
                    displayResults(foundOrders, orderInput.value);
                }

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = '';
                showToast("Erro ao conectar ao servidor. Tente novamente.", 'error');
            } finally {
                searchButton.disabled = false;
                searchButton.innerHTML = 'Buscar';
            }
        };

        // Renderização Glassmorphism
        function displayResults(orders, query) {
            orders.forEach((order, index) => {
                const rastreio = (order.codigoRastreio || '').trim();
                const hasTracking = rastreio && rastreio.toLowerCase() !== 'pendente' && rastreio.length > 5;
                const delay = index * 0.1; 

                const cardHTML = `
                    <div class="glass-card rounded-2xl overflow-hidden fade-in-up border border-slate-200 shadow-sm" style="animation-delay: ${delay}s">
                        
                        <!-- Topo do Card -->
                        <div class="px-6 py-5 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3 bg-white/40">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest mb-1">Status do Pedido</span>
                                <h2 class="text-3xl font-black text-slate-800 tracking-tight">#${order.numeroPedido || 'N/A'}</h2>
                            </div>
                            <span class="px-4 py-2 bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-wider rounded-lg border border-blue-100 shadow-sm">
                                ${order.servico}
                            </span>
                        </div>

                        <!-- Detalhes Internos -->
                        <div class="p-6 space-y-6 relative bg-white/60">
                            
                            <!-- Efeito de brilho suave dentro do card -->
                            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-400/5 rounded-full blur-3xl pointer-events-none"></div>

                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Destinatário</p>
                                <p class="text-lg font-bold text-slate-700">${order.remetente || 'Não informado'}</p>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white/80 p-4 rounded-xl border border-slate-100 shadow-sm">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Liberação</p>
                                    <p class="text-sm font-bold text-slate-700">${order.dataLiberacao}</p>
                                </div>
                                <div class="bg-white/80 p-4 rounded-xl border border-slate-100 shadow-sm">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Correios</p>
                                    <div class="flex items-center gap-2">
                                        <div class="w-2.5 h-2.5 rounded-full shadow-sm ${hasTracking ? 'bg-green-500' : 'bg-amber-400'}"></div>
                                        <p class="text-sm font-bold text-slate-700">
                                            ${hasTracking ? 'Postado' : 'Pendente'}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <!-- Área do Rastreio -->
                            <div class="mt-6 pt-6 border-t border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Código de Rastreamento</p>
                                
                                <div class="flex flex-col sm:flex-row gap-4">
                                    <div class="flex-grow flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-inner">
                                        <span class="font-mono text-xl font-bold text-slate-800 tracking-widest truncate mr-2">
                                            ${!hasTracking ? 'EM BREVE' : rastreio}
                                        </span>
                                        ${hasTracking ? `
                                            <button onclick="window.copyToClipboard('${rastreio}', this)" class="text-slate-400 hover:text-blue-600 transition-colors p-2 bg-white rounded-lg border border-slate-200 shadow-sm hover:bg-blue-50" title="Copiar código">
                                                ${icons.copy}
                                            </button>
                                        ` : ''}
                                    </div>
                                    
                                    ${hasTracking ? `
                                        <a href="https://rastreamento.correios.com.br/app/index.php?objetos=${rastreio}" target="_blank" class="flex-shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-8 py-4 rounded-xl transition-all shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] hover:-translate-y-1 flex items-center justify-center gap-2">
                                            Acompanhar
                                            ${icons.external}
                                        </a>
                                    ` : ''}
                                </div>
                            </div>

                        </div>
                    </div>
                `;
                resultsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Função de Copiar
        window.copyToClipboard = function(text, btnElement) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const original = btnElement.innerHTML;
            btnElement.innerHTML = icons.check;
            btnElement.classList.add('text-green-500');
            btnElement.classList.remove('text-slate-400');
            showToast('Código copiado com sucesso!'); // Feedback adicional
            
            setTimeout(() => {
                btnElement.innerHTML = original;
                btnElement.classList.remove('text-green-500');
                btnElement.classList.add('text-slate-400');
            }, 2000);
        }

        // Listeners Principais
        searchButton.addEventListener('click', (e) => {
            e.preventDefault();
            window.handleSearch();
        });
        orderInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                window.handleSearch();
            }
        });

        // Inicialização
        window.onload = () => {
            loadRecentSearches(); // Carrega histórico ao abrir
            setTimeout(() => orderInput.focus(), 500);
        }
    </script>
</body>
</html>
